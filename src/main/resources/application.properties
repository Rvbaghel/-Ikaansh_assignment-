spring.application.name=hardware-catalog-api
server.port=8080
spring.profiles.active=local
# Neon Database Connection (placeholders only)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-billowing-dew-b41um4qz-pooler.c-6.us-east-2.aws.neon.tech/assignment?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate & Schema Management
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (placeholders only)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}